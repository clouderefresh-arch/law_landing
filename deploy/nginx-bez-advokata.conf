# VPS fallback. On Reg.ru shared hosting SSL is attached by ISPmanager
# (python3 deploy/issue-ssl.py), not by this file.

server {
    listen 80;
    listen [::]:80;
    server_name xn----8sbaabinfs8a6byc.xn--p1ai www.xn----8sbaabinfs8a6byc.xn--p1ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn----8sbaabinfs8a6byc.xn--p1ai www.xn----8sbaabinfs8a6byc.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn----8sbaabinfs8a6byc.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbaabinfs8a6byc.xn--p1ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/bez-advokata;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
